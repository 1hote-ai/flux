<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Splashscreen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: rgba(10, 10, 15, 0.95);
            --text-color: #ffffff;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --muted-text: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05), 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 2rem;
        }

        .logo-container {
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.4));
        }

        .logo-svg {
            width: 80px;
            height: 80px;
        }

        .app-name {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
        }

        .loading-container {
            width: 70%;
            max-width: 180px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin-bottom: 1rem;
        }

        .loading-bar {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent-purple), var(--accent-cyan), transparent);
            animation: loading 1.8s infinite ease-in-out;
            border-radius: 4px;
        }

        .version {
            font-size: 0.75rem;
            color: var(--muted-text);
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes loading {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="fluxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#8b5cf6" />
                        <stop offset="100%" stop-color="#06b6d4" />
                    </linearGradient>
                    <linearGradient id="fluxStroke" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#a78bfa" />
                        <stop offset="100%" stop-color="#22d3ee" />
                    </linearGradient>
                </defs>
                <path d="M50 5 C22.4 5 5 25 5 50 C5 63.8 12.3 76.1 23.4 84.4 L20 95 L34.1 91.1 C39 93.3 44.4 94.6 50 94.6 C77.6 94.6 100 74.6 100 50 C100 25.4 77.6 5 50 5 Z" fill="rgba(255, 255, 255, 0.03)" stroke="url(#fluxStroke)" stroke-width="2"/>
                <path d="M45 25 L65 25 L55 45 L65 45 L40 75 L45 50 L35 50 Z" fill="url(#fluxGradient)"/>
            </svg>
        </div>
        
        <h1 class="app-name">Flux</h1>
        
        <div class="loading-container">
            <div class="loading-bar"></div>
        </div>
        
        <div class="version">v0.1.0</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
                    window.__TAURI__.core.invoke('close_splashscreen').catch(console.error);
                } else if (window.__TAURI__ && window.__TAURI__.invoke) {
                    window.__TAURI__.invoke('close_splashscreen').catch(console.error);
                }
            }, 2000);
        });
    </script>
</body>
</html>
