[package]
name = "flux"
version = "0.1.0"
description = "Flux — modern messenger for teams"
authors = ["Flux Team"]
edition = "2021"

[lib]
name = "flux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"

# ─── Release Profile: minimize binary size ────────────────────────
[profile.release]
opt-level = "s"        # Optimize for size
lto = true             # Link-Time Optimization (cross-crate inlining)
codegen-units = 1      # Single codegen unit (max optimization)
panic = "abort"        # Remove unwind tables
strip = true           # Strip debug symbols

# ─── Dev Profile: fast compilation ────────────────────────────────
[profile.dev]
opt-level = 0
incremental = true
